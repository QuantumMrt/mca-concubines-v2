package com.example.mcaconcubines.item;

import com.example.mcaconcubines.McaConcubinesMod;
import com.example.mcaconcubines.attachment.ModAttachments;
import net.minecraft.world.entity.player.Player;
import net.minecraft.world.entity.npc.AbstractVillager;
import net.minecraft.world.InteractionResultHolder;
import net.minecraft.world.InteractionResult;
import net.minecraft.world.item.Item;
import net.minecraft.world.item.ItemStack;
import net.minecraft.world.InteractionHand;
import net.minecraft.nbt.CompoundTag;
import net.minecraft.network.chat.Component;

public class EmeraldRingItem extends Item {

    public EmeraldRingItem(Item.Properties properties) {
        super(properties.stacksTo(1));
    }

    /**
     * Se usa cuando haces clic derecho en una entidad (villager)
     */
    public InteractionResultHolder<ItemStack> use(net.minecraft.world.level.Level level, Player player, InteractionHand hand) {
        if (!level.isClientSide && player.isShiftKeyDown()) {
            // Comando para ver mis concubinas (shift+clic en aire)
            var data = ModAttachments.getPlayerConcubineData(player);
            if (data.getCantidad() == 0) {
                player.displayClientMessage(Component.literal("§cNo tienes concubinas"), false);
            } else {
                player.displayClientMessage(Component.literal("§6Concubinas: §b" + data.getCantidad()), false);
            }
            return InteractionResultHolder.success(player.getItemInHand(hand));
        }
        return InteractionResultHolder.pass(player.getItemInHand(hand));
    }

    /**
     * Se usa cuando haces clic derecho SOBRE una entidad
     */
    public InteractionResult interactLivingEntity(ItemStack stack, Player player, net.minecraft.world.entity.LivingEntity entity, InteractionHand hand) {
        if (entity.level().isClientSide) {
            return InteractionResult.SUCCESS;
        }

        if (!(entity instanceof AbstractVillager villager)) {
            return InteractionResult.PASS;
        }

        // Obtener datos de concubina del villager
        var villagerData = ModAttachments.getVillagerConcubineData(villager);
        villagerData.inicializarSiNecesario(entity.getRandom());

        // Obtener datos del jugador
        var playerData = ModAttachments.getPlayerConcubineData(player);

        // ─── Validaciones ───────────────────────────────────────────────────

        // 1. ¿El NPC ya es concubina de alguien?
        if (villagerData.tieneDueño()) {
            player.displayClientMessage(
                    Component.literal("§cEste NPC ya es concubina de alguien."),
                    false);
            return InteractionResult.FAIL;
        }

        // 2. ¿El NPC acepta ser concubina?
        if (!villagerData.aceptaConcubina()) {
            player.displayClientMessage(
                    Component.literal("§c" + villager.getName().getString() + " no acepta ser concubina."),
                    false);
            return InteractionResult.FAIL;
        }

        // 3. ¿El jugador ya la tiene como concubina?
        if (playerData.esConcubina(villager.getUUID())) {
            player.displayClientMessage(
                    Component.literal("§cYa es tu concubina."),
                    false);
            return InteractionResult.FAIL;
        }

        // ─── Éxito: establecer la relación ──────────────────────────────────

        playerData.añadirConcubina(villager.getUUID());
        villagerData.setDueño(player.getUUID());

        // Consumir el anillo
        stack.shrink(1);

        // Mensajes
        player.displayClientMessage(
                Component.literal("§6¡" + villager.getName().getString() + " aceptó ser tu concubina!"),
                false);

        McaConcubinesMod.LOGGER.info("El jugador {} tomó a {} como concubina",
                player.getName().getString(), villager.getName().getString());

        return InteractionResult.SUCCESS;
    }
}
